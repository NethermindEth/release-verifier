[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "release-verifier"
version = "0.1.0"
description = "Independent verifier for Nethermind project releases"
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-3.0-only"
dependencies = []

[project.scripts]
release-verifier = "release_verifier.cli:main"

[tool.setuptools]
packages = ["release_verifier"]
